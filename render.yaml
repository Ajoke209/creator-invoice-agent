services:
  - type: web
    name: creator-invoice-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BUSINESS_EMAIL
        sync: false
      - key: INVOICER_NAME
        sync: false
      - key: GEMINI_API_KEY
        sync: false
